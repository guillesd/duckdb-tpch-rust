[package]
name = "tpch_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "tpch_rust"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "1.10503", features = ["vtab-loadable"] }
duckdb-loadable-macros = "1.10503"
libduckdb-sys = { version = "1.10503", features = ["loadable-extension"] }
# Pure-Rust, zero-dependency TPC-H generators used by the DuckDB-table path.
tpchgen = "2.0.2"
# tokio-based runner used by the Parquet path (writes files directly).
tpchgen-cli = "2.0.2"
tokio = { version = "1.44.1", features = ["rt", "rt-multi-thread"] }